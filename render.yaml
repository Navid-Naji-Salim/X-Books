services:
  - type: web
    name: x-books
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy --config prisma.config.ts
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: x-books-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: x-books-db
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 1
    databaseName: xbooks
    user: xbooks
    postgresMajorVersion: "18"
    ipAllowList: []
